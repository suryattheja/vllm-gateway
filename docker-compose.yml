# docker-compose.yml — Multi-Container Application Definition
#
# Docker Compose lets you define and run multiple containers as one application.
# Instead of running 5 separate "docker run" commands with complex flags,
# "docker compose up" starts everything with correct networking and dependencies.
#
# Each "service" below becomes one container. Docker Compose automatically creates
# a private network and gives each container a DNS name matching its service name.
# So the gateway can reach vLLM at http://vllm:8000 without knowing its IP.
#
# Usage:
#   docker compose up -d        # Start all services in the background
#   docker compose logs -f vllm # Stream logs from the vllm service
#   docker compose down         # Stop and remove all containers

version: '3.8'

services:

  # =========================================================================
  # vLLM — LLM Inference Server
  # =========================================================================
  vllm:
    image: vllm/vllm-openai:latest

    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      - NVIDIA_VISIBLE_DEVICES=all

    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface

    ports:
      - "8000:8000"

    command: >
      --model Qwen/Qwen2.5-3B-Instruct
      --dtype float16
      --max-model-len 8192
      --gpu-memory-utilization 0.85
      --max-num-batched-tokens 8192
      --max-num-seqs 256
      --enable-prefix-caching
      --served-model-name qwen2.5-3b
      --tensor-parallel-size 1

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]


  # =========================================================================
  # Gateway — FastAPI Proxy Layer
  # =========================================================================
  gateway:
    build: ./gateway

    ports:
      - "8080:8080"

    environment:
      - VLLM_URL=http://vllm:8000
      - API_KEYS=${API_KEYS}
      - RATE_LIMIT_RPM=60

    depends_on:
      vllm:
        condition: service_healthy


  # =========================================================================
  # Prometheus — Metrics Collection and Storage
  # =========================================================================
  prometheus:
    image: prom/prometheus:latest

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'


  # =========================================================================
  # Grafana — Metrics Visualization and Dashboards
  # =========================================================================
  grafana:
    image: grafana/grafana:latest

    ports:
      - "3000:3000"

    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true

    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards


  # =========================================================================
  # NVIDIA GPU Exporter — Hardware Metrics Bridge
  # =========================================================================
  nvidia-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.1.0

    ports:
      - "9835:9835"

    environment:
      - NVIDIA_VISIBLE_DEVICES=all

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]


# =========================================================================
# Named Volumes
# =========================================================================
volumes:
  prometheus_data:
  grafana_data: